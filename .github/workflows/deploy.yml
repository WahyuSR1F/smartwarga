name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Vercel secrets
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID_VALUE: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_VALUE: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          missing=0

          check_secret() {
            local name="$1"
            local value="${2:-}"

            if [[ -z "$value" ]]; then
              echo "::error title=Missing Vercel secret::$name is MISSING or EMPTY. Please configure it in GitHub Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "$name: PRESENT"
            fi
          }

          check_secret "VERCEL_TOKEN" "$VERCEL_TOKEN_VALUE"
          check_secret "VERCEL_ORG_ID" "$VERCEL_ORG_ID_VALUE"
          check_secret "VERCEL_PROJECT_ID" "$VERCEL_PROJECT_ID_VALUE"

          if [[ "$missing" -eq 1 ]]; then
            echo "::error::One or more required Vercel secrets are missing or empty."
            echo "::error::Please verify the secrets, then confirm by rerunning the workflow."
            exit 1
          fi

          echo "All required Vercel secrets are present."

      - name: Verify Vercel authentication
        shell: bash
        run: |
          set -euo pipefail
          # Validates that VERCEL_TOKEN maps to a real, existing Vercel user
          # before we attempt to link. Surfaces credential problems early with
          # a clear message instead of a cryptic 404 during `vercel link`.
          # No secret values are printed.
          if ! npx vercel@latest whoami --token="$VERCEL_TOKEN" 2>/tmp/whoami.err; then
            echo "::error title=Vercel auth failed::VERCEL_TOKEN is invalid, revoked, expired, or belongs to a deleted Vercel account (User not found / 404)."
            echo "::error::Update VERCEL_TOKEN (and verify VERCEL_ORG_ID and VERCEL_PROJECT_ID) in GitHub Settings > Secrets and variables > Actions, then rerun the workflow."
            cat /tmp/whoami.err
            exit 1
          fi
          echo "Vercel authentication OK."

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          # Start from a clean state so no stale .vercel/project.json from a
          # previous run or the checked-out repo is reused.
          rm -rf .vercel

          # Use the CLI's own linker (not a hand-written project.json). This
          # writes a valid, API-verified .vercel/project.json and is the
          # supported way to link non-interactively. --scope is the Vercel
          # Team/Account ID (VERCEL_ORG_ID); --project is the Project ID.
          # If this fails with a 404/forbidden, the org/project IDs are wrong
          # or the token lacks access — update the secrets, do not change code.
          npx vercel@latest link \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

          echo "Vercel project linked successfully."

      - name: Pull Vercel environment
        run: |
          npx vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b33" />
    <title>Smart Warga · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8f8f5; color: #173b33; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; border: 1px solid #dfe9e2; border-radius: 28px; background: #fff; padding: 32px; box-shadow: 0 20px 60px rgba(44,72,57,.08); }
      .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; background: #173b33; color: #f7d58e; font-size: 22px; }
      h1 { margin: 22px 0 10px; letter-spacing: -.04em; font-size: 28px; }
      p { margin: 0; color: #71827b; line-height: 1.65; font-size: 14px; }
      a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 999px; background: #173b33; color: white; text-decoration: none; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body><main><div class="mark">⌂</div><h1>Koneksi sedang jeda.</h1><p>Smart Warga akan tersambung kembali saat internet tersedia. Silakan periksa koneksi lalu coba lagi.</p><a href="/">Coba lagi</a></main></body>
</html>
